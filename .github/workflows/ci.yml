name: CI

on:
  push:
    branches: [main, base]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Catalog tests
        run: python -m unittest discover -s tests
      - name: Plugin tests
        run: |
          for suite in plugins/*/tests; do
            echo "== $suite"
            python -m unittest discover -s "$suite"
          done
      - name: Catalog is in sync with the plugins
        run: python tools/marketplace.py --check
      - name: Plugins are in sync (version, manifest, generated files)
        run: |
          for tool in plugins/*/tools/sync.py; do
            echo "== $tool"
            python "$tool" --check
          done
