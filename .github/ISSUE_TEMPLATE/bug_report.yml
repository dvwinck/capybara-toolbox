name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      placeholder: ar-board 1.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal `batch.json` helps a lot.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.13, Claude Code 2.1, Chrome
